<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NeighborhoodMatcher logo">
  <!--
    A neighbourhood as a grid of blocks; the one block that matches its
    counterpart is picked out and joined to it. Single-tile mark so it
    survives as a 16 px favicon and reads on light and dark backgrounds.
  -->
  <rect width="64" height="64" rx="14" fill="#2563eb"/>
  <!-- the other blocks: candidates that were not the match -->
  <g fill="#ffffff" fill-opacity="0.4">
    <rect x="26" y="10" width="12" height="12" rx="3"/>
    <rect x="42" y="10" width="12" height="12" rx="3"/>
    <rect x="10" y="26" width="12" height="12" rx="3"/>
    <rect x="42" y="26" width="12" height="12" rx="3"/>
    <rect x="10" y="42" width="12" height="12" rx="3"/>
    <rect x="26" y="42" width="12" height="12" rx="3"/>
  </g>
  <!-- the match: target block linked to its supplemental counterpart -->
  <path d="M16 16 L48 48" stroke="#ffffff" stroke-width="3.75" stroke-linecap="round"/>
  <rect x="10" y="10" width="12" height="12" rx="3" fill="#ffffff"/>
  <rect x="42" y="42" width="12" height="12" rx="3" fill="#ffffff"/>
</svg>
