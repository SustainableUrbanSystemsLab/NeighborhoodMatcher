# Builds the desktop app (Tauri) for macOS (Apple Silicon) and Windows (x64,
# with the WebView2 runtime embedded so it installs on air-gapped machines).
#
# - On a version tag (v0.9.0 …) the installers are attached to a GitHub
#   Release under STABLE names, which the About page links to via
#   .../releases/latest/download/<name>.
# - `workflow_dispatch` builds the same installers as workflow artifacts
#   (no release), for testing a branch.
#
# CSP (webapp/src-tauri/tauri.conf.json): 'self' only, 'wasm-unsafe-eval'
# for Pyodide, blob: workers, connect-src limited to the app and Tauri's IPC
# — the window cannot reach the network even if code tried. Tauri adds
# hashes/nonces to script-src; style-src modification is disabled because a
# nonce there would switch off 'unsafe-inline', which React style attributes
# need. webapp/tests/desktop-csp.spec.ts runs the app under this exact CSP
# in Chromium (WebView2's engine) and WebKit (WKWebView's).
#
# The apps are unsigned: macOS shows "unidentified developer" (right-click →
# Open, or `xattr -d com.apple.quarantine`), Windows SmartScreen shows "More
# info → Run anyway". Signing needs certificates in repository secrets; see
# https://v2.tauri.app/distribute/sign/ when they exist.

name: Desktop app

on:
  push:
    tags: ["v*"]
  # Pull requests that touch the desktop wrapper build both installers as
  # artifacts (no release), so a broken Tauri config never reaches a tag.
  pull_request:
    paths:
      - "webapp/src-tauri/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - os: windows-latest
            platform: windows
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.os }}
    env:
      # package.json pins pnpm via packageManager; corepack must not phone
      # home for "latest" (stale signing keys break the fetch).
      COREPACK_DEFAULT_TO_LATEST: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable corepack (pnpm)
        run: corepack enable

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "webapp/src-tauri -> target"

      - name: Tag matches the shipped version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(node -p "require('./webapp/package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $v — run scripts/bump_version.py and tag v$v"
            exit 1
          fi

      - name: Install dependencies
        working-directory: webapp
        run: pnpm install --frozen-lockfile

      # `tauri build` runs `pnpm build:web` (sync-assets: Pyodide runtime +
      # numpy wheel into public/, then vite build) and bundles ../dist.
      - name: Build the app (and release it on a tag)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: webapp
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && 'v__VERSION__' || '' }}
          releaseName: "NeighborhoodMatcher v__VERSION__"
          releaseBody: |
            Desktop app for machines without Internet access. The same matching engine as https://nbhdmatch.netlify.app/, with the Python runtime included — nothing is downloaded and no data leaves the computer.

            - **macOS (Apple Silicon):** `NeighborhoodMatcher-darwin-aarch64.dmg`. The app is not signed: on first launch, right-click the app → Open (or run `xattr -d com.apple.quarantine /Applications/NeighborhoodMatcher.app`).
            - **Windows (x64):** `NeighborhoodMatcher-windows-x64-setup.exe`, with the WebView2 runtime embedded so it installs offline. SmartScreen: "More info → Run anyway".

            A zip of the website for hosting inside an institution is at https://nbhdmatch.netlify.app/about#offline.
          releaseDraft: false
          prerelease: false
          # tauri-action substitutes [platform] = darwin | windows | linux,
          # [arch] = aarch64 | x64 | universal, [setup] = "-setup" for NSIS,
          # [ext] = the file extension: stable names the About page links to.
          releaseAssetNamePattern: "NeighborhoodMatcher-[platform]-[arch][setup][ext]"
          args: ${{ matrix.args }}

      # Run the built app on the runner: with NBHDMATCH_SELFTEST set, the page
      # parses two small CSVs, checks the identifier guard, runs a full match
      # through the Pyodide worker loaded from the app bundle, saves the
      # results package through the app, confirms the network is blocked,
      # and writes PASS/FAIL to the report file (webapp/src/lib/desktop-selftest.ts).
      # Runs the app from inside the shipped .dmg (tauri build deletes the
      # intermediate .app after packing it), so the distributable itself is
      # what gets tested.
      - name: Self-test the app (macOS, WKWebView)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          dmg=$(ls webapp/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          trap 'hdiutil detach "$mnt" -force >/dev/null 2>&1 || true' EXIT
          app=$(ls -d "$mnt"/*.app | head -1)
          bin=$(ls "$app"/Contents/MacOS/* | head -1)
          echo "running $bin"
          codesign -dv "$app" 2>&1 | head -3 || true
          export NBHDMATCH_SELFTEST="$RUNNER_TEMP/selftest.txt"
          export NBHDMATCH_DOWNLOAD_DIR="$RUNNER_TEMP/selftest-downloads"
          mkdir -p "$NBHDMATCH_DOWNLOAD_DIR"
          "$bin" &
          pid=$!
          for _ in $(seq 1 360); do
            [ -s "$NBHDMATCH_SELFTEST" ] && break
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          sleep 1
          kill "$pid" 2>/dev/null || true
          if [ ! -s "$NBHDMATCH_SELFTEST" ]; then echo "::error::the app wrote no self-test report"; exit 1; fi
          cat "$NBHDMATCH_SELFTEST"
          grep -q '^PASS' "$NBHDMATCH_SELFTEST"
          unzip -l "$NBHDMATCH_DOWNLOAD_DIR/selftest-results.zip"
          unzip -p "$NBHDMATCH_DOWNLOAD_DIR/selftest-results.zip" run_info.csv | grep 'identifier_columns_blocked'

      - name: Self-test the app (Windows, WebView2)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $env:NBHDMATCH_SELFTEST = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $env:NBHDMATCH_DOWNLOAD_DIR = Join-Path $env:RUNNER_TEMP "selftest-downloads"
          New-Item -ItemType Directory -Force -Path $env:NBHDMATCH_DOWNLOAD_DIR | Out-Null
          $exe = Get-ChildItem webapp/src-tauri/target/release/*.exe | Select-Object -First 1
          Write-Host "running $($exe.FullName)"
          $p = Start-Process -FilePath $exe.FullName -PassThru
          if (-not $p.WaitForExit(360000)) { Stop-Process -Id $p.Id -Force }
          if (-not (Test-Path $env:NBHDMATCH_SELFTEST)) { Write-Error "the app wrote no self-test report"; exit 1 }
          Get-Content $env:NBHDMATCH_SELFTEST
          if (-not (Select-String -Path $env:NBHDMATCH_SELFTEST -Pattern '^PASS' -Quiet)) { exit 1 }
          Get-ChildItem $env:NBHDMATCH_DOWNLOAD_DIR

      # Unit tests of the Rust side (file-name sanitizing, no-overwrite
      # saving). After the build, because generate_context! embeds ../dist.
      - name: Rust unit tests
        if: matrix.platform == 'macos'
        run: cargo test --manifest-path webapp/src-tauri/Cargo.toml --lib

      - name: Upload installers as workflow artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: NeighborhoodMatcher-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            webapp/src-tauri/target/**/bundle/dmg/*.dmg
            webapp/src-tauri/target/**/bundle/nsis/*.exe
