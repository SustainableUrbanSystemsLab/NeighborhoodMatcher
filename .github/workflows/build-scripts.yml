# Runs the one-command builds exactly as a person would: ./build.sh --test on
# macOS and Linux, build.bat --test on Windows. Each installs dependencies,
# runs every test, builds the website and the self-host zip, checks the build
# needs no Internet, and — on macOS and Windows — builds the desktop app and
# runs its self-test. Only on changes to the scripts themselves; the regular
# Tests and Desktop app workflows cover everything else.

name: Build scripts

on:
  pull_request:
    paths:
      - "build.sh"
      - "build.bat"
      - "scripts/build-all.mjs"
      - ".github/workflows/build-scripts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-scripts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            shell: bash
            command: ./build.sh --test
          - os: windows-latest
            shell: cmd
            command: call build.bat --test
          - os: ubuntu-latest
            shell: bash
            command: ./build.sh --test
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux'
      - uses: swatinem/rust-cache@v2
        if: runner.os != 'Linux'
        with:
          workspaces: "webapp/src-tauri -> target"
      - uses: astral-sh/setup-uv@v3
      - name: Build everything (${{ matrix.command }})
        run: ${{ matrix.command }}
      - name: Expected outputs in release/
        shell: bash
        run: |
          ls -la release
          ls release/nbhdmatch-site-v*.zip
          case "${{ runner.os }}" in
            macOS)   ls release/*.dmg ;;
            Windows) ls release/*-setup.exe ;;
          esac
