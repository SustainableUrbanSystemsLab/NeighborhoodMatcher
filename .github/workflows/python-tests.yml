name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  matcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # setup-uv@v3 has no python-version input; pin the interpreter via uv.
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
      - name: Run pytest
        working-directory: matcher
        run: uv run --project . --python 3.10 pytest
      - name: Webapp matcher copy is in sync
        run: |
          node webapp/scripts/sync-assets.mjs
          # -N registers new files so untracked drift also fails the diff
          git add -N webapp/public/matcher webapp/public/explanatory
          git diff --exit-code webapp/public/matcher webapp/public/explanatory

  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    env:
      # package.json pins pnpm via packageManager; corepack must not phone
      # home for "latest" (stale signing keys break the fetch).
      COREPACK_DEFAULT_TO_LATEST: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check and build
        run: pnpm build
